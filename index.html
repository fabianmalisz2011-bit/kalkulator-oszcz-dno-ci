<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesjonalny Kalkulator Oszczędności</title>
    <style>
        :root { --primary: #2ecc71; --dark: #2c3e50; --light: #ecf0f1; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--light); display: flex; justify-content: center; padding: 20px; }
        .calc-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 450px; width: 100%; }
        h2 { color: var(--dark); text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #7f8c8d; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 2px solid #dfe6e9; border-radius: 8px; box-sizing: border-box; font-size: 16px; outline: none; transition: border 0.3s; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: transform 0.2s; }
        button:hover { transform: scale(1.02); background: #27ae60; }
        .results { margin-top: 25px; padding-top: 20px; border-top: 2px solid var(--light); }
        .res-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 16px; }
        .res-item b { color: var(--dark); }
        .highlight { color: var(--primary); font-size: 20px; }
        .disclaimer { font-size: 11px; color: #bdc3c7; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="calc-card">
    <h2>Kalkulator Zysków</h2>
    
    <div class="input-group">
        <label>Kwota na start (PLN)</label>
        <input type="number" id="initial" placeholder="np. 10000" value="5000">
    </div>
    
    <div class="input-group">
        <label>Miesięczna dopłata (PLN)</label>
        <input type="number" id="monthly" placeholder="np. 500" value="200">
    </div>
    
    <div class="input-group">
        <label>Oprocentowanie roczne (%)</label>
        <input type="number" id="rate" step="0.1" placeholder="np. 6.5" value="7">
    </div>
    
    <div class="input-group">
        <label>Okres oszczędzania (lata)</label>
        <input type="number" id="years" placeholder="np. 5" value="5">
    </div>

    <div class="input-group">
        <label>Przewidywana inflacja roczna (%)</label>
        <input type="number" id="inflation" step="0.1" value="5">
    </div>

    <button onclick="calculate()">Oblicz zysk</button>

    <div class="results" id="results" style="display:none;">
        <div class="res-item">Suma wpłat: <b id="totalInvested">0 zł</b></div>
        <div class="res-item">Zysk (po podatku Belki): <b id="netProfit">0 zł</b></div>
        <div class="res-item">Stan konta po <span id="resYears">0</span> latach: <b class="highlight" id="finalBalance">0 zł</b></div>
        <div class="res-item" style="border-top: 1px dashed #ccc; padding-top: 5px;">Siła nabywcza (realna): <b id="realValue" title="Wartość uwzględniająca inflację">0 zł</b></div>
    </div>

    <p class="disclaimer">*Obliczenia uwzględniają podatek od zysków kapitałowych (19%) oraz kapitalizację miesięczną.</p>
</div>

<script>
function calculate() {
    let initial = parseFloat(document.getElementById('initial').value) || 0;
    let monthly = parseFloat(document.getElementById('monthly').value) || 0;
    let annualRate = (parseFloat(document.getElementById('rate').value) / 100) || 0;
    let years = parseInt(document.getElementById('years').value) || 0;
    let inflationRate = (parseFloat(document.getElementById('inflation').value) / 100) || 0;

    let months = years * 12;
    let monthlyRate = annualRate / 12;
    let totalBalance = initial;
    let totalInvested = initial + (monthly * months);

    for (let i = 0; i < months; i++) {
        let interest = totalBalance * monthlyRate;
        // Odejmujemy podatek Belki (19%) od razu przy kapitalizacji
        totalBalance += interest * 0.81; 
        totalBalance += monthly;
    }

    let netProfit = totalBalance - totalInvested;
    
    // Obliczanie siły nabywczej (uwzględnienie inflacji)
    let realValue = totalBalance / Math.pow(1 + inflationRate, years);

    document.getElementById('totalInvested').innerText = totalInvested.toLocaleString() + " zł";
    document.getElementById('netProfit').innerText = Math.max(0, netProfit).toLocaleString(undefined, {maximumFractionDigits: 2}) + " zł";
    document.getElementById('finalBalance').innerText = totalBalance.toLocaleString(undefined, {maximumFractionDigits: 2}) + " zł";
    document.getElementById('realValue').innerText = realValue.toLocaleString(undefined, {maximumFractionDigits: 2}) + " zł";
    document.getElementById('resYears').innerText = years;
    document.getElementById('results').style.display = 'block';
}
</script>

</body>
</html>
